[package]
name = "shophippy-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shophippy — open-source international payment gateway API"
repository = "https://github.com/shophippy/shophippy"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "rust_decimal", "macros", "migrate"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.5"

[[bin]]
name = "shophippy-api"
path = "src/main.rs"
