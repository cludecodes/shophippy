name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shophippy
          POSTGRES_PASSWORD: shophippy
          POSTGRES_DB: shophippy
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U shophippy"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system TLS deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Build
        working-directory: api
        env:
          SHOPHIPPY_DATABASE_URL: postgres://shophippy:shophippy@localhost:5432/shophippy
          SHOPHIPPY_REDIS_URL: redis://localhost:6379
        run: cargo build --locked --verbose
      - name: Tests (unit)
        working-directory: api
        run: cargo test --locked

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm install
      - run: npm run build
